name: Build Fork App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Pull LFS files in submodules
        run: |
          git lfs pull
          git submodule foreach --recursive 'git lfs pull'

      - name: Build
        run: |
          xcodebuild \
            -project azooKeyMac.xcodeproj \
            -scheme azooKeyMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/azooKeyMac.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" azooKeyMac-fork.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azooKeyMac-fork
          path: azooKeyMac-fork.zip
          retention-days: 30
