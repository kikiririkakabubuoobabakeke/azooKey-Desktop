name: Build Fork App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (optional, e.g. v0.1.5-fork.2)"
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Pull LFS files in submodules
        run: |
          git lfs pull
          git submodule foreach --recursive 'git lfs pull'

      - name: Build
        run: |
          xcodebuild \
            -project azooKeyMac.xcodeproj \
            -scheme azooKeyMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/azooKeyMac.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" azooKeyMac-fork.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azooKeyMac-fork
          path: azooKeyMac-fork.zip
          retention-days: 30

      - name: Publish release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "azooKey Desktop fork build" --prerelease
          gh release upload "$TAG" azooKeyMac-fork.zip install-fork.sh FORK.md --repo "${{ github.repository }}" --clobber
